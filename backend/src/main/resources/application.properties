spring.application.name=backend

spring.datasource.url=${PCMS_DB_URL:jdbc:mysql://localhost:3306/pcms_db}
spring.datasource.username=${PCMS_DB_USERNAME:root}
spring.datasource.password=${PCMS_DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=${PCMS_JPA_DDL_AUTO:update}
spring.jpa.show-sql=${PCMS_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true

spring.mail.host=${PCMS_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${PCMS_MAIL_PORT:587}
spring.mail.username=${PCMS_MAIL_USERNAME:}
spring.mail.password=${PCMS_MAIL_PASSWORD:}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.default-encoding=UTF-8

server.port=${SERVER_PORT:8080}

# Simulated payments must remain disabled in the real application.
pcms.payment.demo-mode=false